server {
    listen 80;
    root /usr/share/nginx/html;

    # Allow file uploads up to 60 MB (backend limit is 50 MB)
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no entry for .mjs (ES module JS) — served
    # unmatched, it falls back to application/octet-stream, which browsers
    # refuse to execute as a module script. Breaks pdf.js's module worker.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location /api {
        proxy_pass http://docuvault:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Long timeouts for large uploads and streaming downloads
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        # Disable buffering so downloads stream to the browser immediately
        proxy_buffering          off;
        proxy_request_buffering  off;
    }

    location /webhook {
        proxy_pass http://docuvault:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
