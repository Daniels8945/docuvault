services:

  # ── Data layer ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-docuvault}
      POSTGRES_USER:     ${POSTGRES_USER:-docuvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD:    ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-docuvault}
      POSTGRES_DB:   ${POSTGRES_DB:-docuvault}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/backup_$$STAMP.sql.gz \
            && echo "[backup] Saved backup_$$STAMP.sql.gz"
          find /backups -name '*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

  # ── WhatsApp ────────────────────────────────────────────────────────────────

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    shm_size: '512mb'
    environment:
      WHATSAPP_API_KEY:              ${WAHA_API_KEY}
      WHATSAPP_HOOK_URL:             http://docuvault:8000/webhook/waha
      WHATSAPP_HOOK_EVENTS:          message
      WHATSAPP_FILES_MIMETYPES:      "application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_AUTO_START:               "true"
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Application ─────────────────────────────────────────────────────────────

  docuvault:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-docuvault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-docuvault}
      S3_ENDPOINT:     eu2.contabostorage.com
      S3_ACCESS_KEY:   ${S3_ACCESS_KEY}
      S3_SECRET_KEY:   ${S3_SECRET_KEY}
      S3_BUCKET:       ${S3_BUCKET:-docuvualt}
      S3_SECURE:       "true"
      WAHA_API_KEY:    ${WAHA_API_KEY}
      WAHA_BASE_URL:   http://waha:3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      docuvault:
        condition: service_healthy

  # ── Monitoring stack ────────────────────────────────────────────────────────

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"
    depends_on:
      - docuvault
      - cadvisor

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-docuvault}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:3001"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  waha_sessions:
  prometheus_data:
  grafana_data:
